version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Backend: Flask API + WebSocket + AI Chatbot
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: system_monitor_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - PYTHONUNBUFFERED=1
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    depends_on:
      - mongodb
    networks:
      - monitor_net

  # ---------------------------------------------------------------------------
  # Frontend: Nginx Web Server & Reverse Proxy
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: system_monitor_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - monitor_net

  # ---------------------------------------------------------------------------
  # Database: MongoDB
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:latest
    container_name: system_monitor_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - monitor_net

  # ---------------------------------------------------------------------------
  # Metrics: Prometheus
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: system_monitor_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./backend/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - backend
    networks:
      - monitor_net

  # ---------------------------------------------------------------------------
  # Dashboards: Grafana
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: system_monitor_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitor_net

  # ---------------------------------------------------------------------------
  # Logging: Loki
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:latest
    container_name: system_monitor_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    networks:
      - monitor_net

networks:
  monitor_net:
    driver: bridge

volumes:
  mongodb_data:
  grafana_data:
